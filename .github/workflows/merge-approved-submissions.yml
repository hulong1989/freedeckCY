name: Scheduled merge approved submissions

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: freedeckcy-catalog-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge approved issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --label auto-merge --state open --limit 50 \
            --json number,title,body > /tmp/approved-issues.json
          python scripts/merge_approved_issues.py /tmp/approved-issues.json

      - name: Commit catalog updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "freedeckCY submission bot"
          git config user.email "actions@users.noreply.github.com"
          git add defaults/tianyi_catalog/freedeckcy_catalog.csv submissions
          if git diff --cached --quiet; then
            echo "no catalog changes"
            exit 0
          fi
          git commit -m "catalog: merge approved submissions"
          git push origin main
