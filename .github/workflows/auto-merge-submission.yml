name: Auto merge game submission

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: freedeckcy-catalog-merge
  cancel-in-progress: false

jobs:
  merge:
    if: |
      github.event.label.name == 'auto-merge' &&
      startsWith(github.event.issue.title, '[游戏提交]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse issue form
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          jq -r '.issue.body' "$GITHUB_EVENT_PATH" > /tmp/issue-body.md
          python scripts/issue_to_submission.py \
            --body-file /tmp/issue-body.md \
            --out "submissions/issue-${ISSUE_NUMBER}.json" \
            --issue-number "$ISSUE_NUMBER"

      - name: Validate submission
        run: python scripts/validate_submissions.py

      - name: Merge into catalog
        run: python scripts/merge_submissions.py --apply


      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "freedeckCY submission bot"
          git config user.email "actions@users.noreply.github.com"
          git add defaults/tianyi_catalog/freedeckcy_catalog.csv submissions
          if git diff --cached --quiet; then
            echo "no catalog changes"
            exit 0
          fi
          git commit -m "catalog: auto merge submission #${{ github.event.issue.number }}"
          git push origin main

      - name: Comment and close issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "✅ 已自动合并进服务器 CSV。玩家在插件设置页点「更新游戏列表」下载最新 CSV 后即可看到该游戏。"
          gh issue close "$ISSUE_NUMBER"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "❌ 自动合并失败，请检查 Action 日志并修正表单字段；维护者移除并重新添加 auto-merge 标签可重试。"
          gh issue edit "$ISSUE_NUMBER" --remove-label auto-merge || true
